    end_to_end_before: "Round-1 short 68.771468 s; Round-1 full 554.191518 s; initial Stage-1 full 563.833686 s"
    end_to_end_after: "short 62.977993 s; full 500.507781 s; FINAL_VAL_LOSS 1.08257675; Phase-4 L0 76.585270 s"
    remaining_bottleneck: "Terminal target met. Phase-4 L0 rank0 Free fell to 31.708 ms; any future work must start with a fresh L1 and reconsider rank image-load balance/layout fragmentation."
    is_terminal: true
  platform_findings:
    - "On asynchronous NPU execution, replacing a queue-draining operation can merely move the wait to the next scalar readback; evaluate the complete chain."
    - "A slower isolated dense image-token replacement can improve end to end by avoiding dynamic-index queue drainage; framework masked_scatter was still slower than a custom cumsum/index_select/where implementation."
    - "Batching detached scalar loss readback to an epoch boundary removed about 7.45% relative to the immediately preceding short variant without changing optimizer inputs."
    - "A 256-GiB host-memory request is insufficient for 16-rank initialization of this workload; use 512 GiB."
